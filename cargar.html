<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <title>ZHARO · Cargar cliente</title>
  <link rel="stylesheet" href="css/app.css?v=sim7">
</head>
<body>
  <div class="wrap">
    <div id="devBanner" class="hidden"></div>
    <div class="top">
      <div class="brand">
        <h1><b>ZHARO</b></h1>
        <div class="tag">Cargar cliente</div>
      </div>
      <div class="userbar" id="userbar"></div>
    </div>

    <div class="card">
      <label>Agencia</label>
      <input id="agencia" autocomplete="off"><div class="msg" id="m_agencia"></div>

      <label>DNI</label>
      <input id="dni" inputmode="numeric" maxlength="8"><div class="msg" id="m_dni"></div>

      <label>Nombre y apellido</label>
      <input id="nombre" autocomplete="off"><div class="msg" id="m_nombre"></div>

      <label>Año</label>
      <select id="anio"><option value="">Elegí el año</option></select><div class="msg" id="m_anio"></div>

      <label>Marca</label>
      <div class="combo" data-key="marca">
        <input id="c_marca" class="combo-in" placeholder="Elegí o buscá marca" autocomplete="off" disabled>
        <ul class="combo-list hidden" id="list_marca" role="listbox"></ul>
      </div>
      <input id="marca" class="otro" placeholder="Escribí la marca"><div class="msg" id="m_marca"></div>

      <label>Modelo</label>
      <div class="combo" data-key="modelo">
        <input id="c_modelo" class="combo-in" placeholder="Elegí o buscá modelo" autocomplete="off" disabled>
        <ul class="combo-list hidden" id="list_modelo" role="listbox"></ul>
      </div>
      <input id="modelo" class="otro" placeholder="Escribí el modelo"><div class="msg" id="m_modelo"></div>

      <label>Versión</label>
      <div class="combo" data-key="version">
        <input id="c_version" class="combo-in" placeholder="Elegí o buscá versión" autocomplete="off" disabled>
        <ul class="combo-list hidden" id="list_version" role="listbox"></ul>
      </div>
      <input id="version" class="otro" placeholder="Escribí la versión"><div class="msg" id="m_version"></div>

      <label>Neto a solicitar <i>(opcional)</i></label>
      <input id="neto" inputmode="numeric" placeholder="$ 0">
      <div class="chk"><input type="checkbox" id="max" checked><span>Máximo</span></div>
      <div class="msg" id="m_neto"></div>

      <label>Plazo (meses)</label>
      <select id="plazo">
        <option value="">Elegí</option>
        <option>12</option><option>18</option><option>24</option>
        <option>36</option><option>48</option><option>60</option>
      </select>
      <div class="msg" id="m_plazo"></div>

      <div class="actions" style="margin-top:18px">
        <button class="btn primary block" id="send" type="button">Enviar a cotizar</button>
        <button class="btn block" id="copy" type="button">Copiar payload (prueba)</button>
      </div>
    </div>

    <div id="resultBox" class="card hidden"></div>
  </div>

  <div class="footer"><div class="inner">
    <a href="index.html" data-nav="home">Inicio</a>
    <a href="cargar.html" data-nav="cargar" class="active">Cargar</a>
    <a href="casos.html" data-nav="casos">Casos</a>
    <a href="config.html" data-nav="config">Config</a>
  </div></div>

  <script src="js/config.js?v=live1"></script>
  <script src="js/auth.js?v=sim4"></script>
  <script src="js/casos.js?v=live1"></script>
  <script src="js/ui.js?v=live1"></script>
  <script src="js/cargar.js?v=sim7"></script>
</body>
</html>
