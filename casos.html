<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>ZHARO · Gestión de casos</title>
  <link rel="stylesheet" href="css/app.css?v=gest4">
</head>
<body>
  <div class="wrap wrap-wide">
    <div id="devBanner" class="hidden"></div>
    <div class="top">
      <div class="brand">
        <h1><b>ZHARO</b></h1>
        <div class="tag">Gestión y seguimiento</div>
      </div>
      <div class="userbar" id="userbar"></div>
    </div>

    <div class="ops-head"><h2 class="ops-title">Consultas</h2><span class="muted ops-crumb">Inicio / Gestión / Casos</span></div>
    <div class="ops-kpis" id="opsKpis"></div>
    <div class="ops-bars card hidden" id="opsBars"></div>
    <div id="alertBox" class="hidden"></div>
    <div class="card ops-card">
      <div class="ops-toolbar">
        <input id="fltQ" type="search" placeholder="Buscar cliente, agencia, vehículo, comercial…">
        <select id="fltAgencia"><option value="todas">Agencia: todas</option></select>
        <select id="fltComercial"><option value="todos">Comercial: todos</option></select>
        <select id="fltFecha"><option value="todos" selected>Fecha: todas</option><option value="hoy">Hoy</option><option value="7">7 días</option><option value="30">30 días</option></select>
        <select id="fltCanal"><option value="cualquiera">Canal: cualquiera</option><option value="columbia">Columbia</option><option value="galicia">Galicia</option><option value="creditcar">CreditCar</option></select>
        <select id="fltRes"><option value="todos">Resultado: todos</option><option value="aprobado">Aprobado</option><option value="sin_oferta">Sin oferta</option><option value="pendiente">Pendiente</option></select>
        <button type="button" class="ops-btn primary" id="fltSearch">Buscar</button><button type="button" class="ops-clear" id="fltClear">Limpiar</button>
      </div>
      <div class="ops-meta"><span class="muted" id="syncNote">Datos del bot + casos de este dispositivo.</span><span class="muted" id="listCount"></span></div>
      <div id="lista"></div>
    </div>
  </div>

  <div class="footer"><div class="inner wrap-wide-footer">
    <a href="index.html" data-nav="home">Inicio</a>
    <a href="cargar.html" data-nav="cargar">Cargar</a>
    <a href="casos.html" data-nav="casos" class="active">Casos</a>
    <a href="config.html" data-nav="config">Config</a>
  </div></div>

  <script src="js/config.js?v=gest4"></script>
  <script src="js/auth.js?v=gest4"></script>
  <script src="js/casos.js?v=gest4"></script>
  <script src="js/ui.js?v=gest4"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const u = await ZharoAuth.requireAuth();
      if (!u) return;
      zharoPaintChrome("casos");
      const state = { all: [] };
      const $ = id => document.getElementById(id);
      const lista = $("lista"), alertBox = $("alertBox");
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
      const SHORT = { columbia: "Col", galicia: "Gal", creditcar: "CC" };
      const currentFilters = () => ({ canal: $("fltCanal").value, resultado: $("fltRes").value, agencia: $("fltAgencia").value, comercial: $("fltComercial").value, fecha: $("fltFecha").value });

      function fillSelects(casos) {
        [["fltAgencia","agencia","todas","Agencia: todas"],["fltComercial","comercial","todos","Comercial: todos"]].forEach(([id,f,all,lab]) => {
          const el = $(id), cur = el.value;
          el.innerHTML = `<option value="${all}">${lab}</option>` + ZharoCasos.uniqueValues(casos, f).map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
          if ([...el.options].some(o => o.value === cur)) el.value = cur;
        });
      }
      const tile = (lab, val, sub, cls="") => `<div class="ops-tile ${cls}"><div class="ops-tl">${lab}</div><div class="ops-tv">${val}</div>${sub?`<div class="ops-ts">${sub}</div>`:""}</div>`;

      function renderKpis(casos) {
        const s = ZharoCasos.computeStats(casos);
        const pend = casos.filter(c => ZharoCasos.overallStatus(c) === "pendiente").length;
        let h = tile("Total consultas", s.total, "", "t-blue")
          + tile("Aprobación", s.total ? s.aprobPct + "%" : "—", s.total ? `${s.aprobCount} de ${s.total}` : "", "t-green")
          + tile("Pendientes", pend, "", "t-amber");
        h += ZharoCasos.CHANNEL_IDS.map(id => { const p = s.perCanal[id]; return tile(ZharoCasos.CHANNEL_LABEL[id], p.pct == null ? "—" : p.pct + "%", `${p.ok}/${p.n||0} OK`); }).join("");
        h += s.topAgencias.slice(0, 2).map(a => tile("Agencia", a.n, esc(a.nombre))).join("");
        $("opsKpis").innerHTML = h;
        const max = Math.max(1, ...s.topAgencias.map(a => a.n));
        $("opsBars").innerHTML = s.topAgencias.length ? `<div class="ops-bars-h">Simulaciones por agencia</div>` + s.topAgencias.map(a =>
          `<div class="ops-bar"><span title="${esc(a.nombre)}">${esc(a.nombre)}</span><div><i style="width:${Math.round(a.n/max*100)}%"></i></div><b>${a.n}</b></div>`).join("") : "";
        $("opsBars").classList.toggle("hidden", !s.topAgencias.length);
      }
      function renderAlerts(casos) {
        const al = ZharoCasos.repeatAlerts(casos, ZharoCasos.REPEAT_THRESHOLD);
        if (!al.length) { alertBox.className = "hidden"; alertBox.innerHTML = ""; return; }
        alertBox.className = "banner alert-ops";
        alertBox.innerHTML = `<div class="alert-title">Alerta de repetición</div>` + al.slice(0,5).map(a => `<div><b>${esc(a.comercial)}</b> simuló <b>${a.n}</b> veces en <b>${esc(a.agencia)}</b></div>`).join("");
      }
      const chPill = (c, id) => { const r = (c.channels[id]||{}).resultado; const cls = r == null ? "wait" : ZharoCasos.pillClass(r); return `<span class="pill ch-pill ${cls}" title="${ZharoCasos.CHANNEL_LABEL[id]}">${r == null ? "—" : ZharoCasos.pillLabel(r)}</span>`; };
      const estado = c => { const ov = ZharoCasos.overallStatus(c); return `<span class="ops-st ${ZharoCasos.pillClass(ov)}">${ov === "pre_aprobado" ? "Aprobado" : ov === "sin_oferta" ? "Sin oferta" : "Pendiente"}</span>`; };
      function detailHtml(c) {
        return ZharoCasos.CHANNEL_IDS.map(id => { const ch = c.channels[id]||{}, r = ch.resultado;
          const l = r == null ? "sin dato" : r === "pre_aprobado" ? "Pre aprobado" : r === "sin_oferta" ? "Sin oferta" : "Pendiente";
          return `<div class="detail-ch"><b>${ZharoCasos.CHANNEL_LABEL[id]}</b> · ${l} · neto ${ch.neto != null ? ZharoCasos.fmtMoney(ch.neto) : "—"} · plazos ${esc(ch.plazos || "—")}</div>`; }).join("");
      }
      function renderList(casos) {
        $("listCount").textContent = `Mostrando ${casos.length} ${casos.length === 1 ? "registro" : "registros"}`;
        if (!casos.length) { lista.innerHTML = `<p class="muted ops-empty">No hay casos con estos filtros. <a href="cargar.html">Cargar una cotización</a></p>`; return; }
        const rows = casos.map((c, i) => `<tr class="ops-row ${c.href ? "is-link" : "is-exp"}" data-i="${i}">
            <td class="c-cli"><b>${esc(ZharoCasos.clientLabel(c))}</b></td>
            <td><span class="ops-ag">${esc(c.agencia || "—")}</span></td>
            <td class="c-veh" title="${esc(c.vehiculo)}">${esc(c.vehiculo || "—")}</td>
            <td class="c-num">$ ${ZharoCasos.fmtMoney(c.neto_pedido)}</td>
            ${ZharoCasos.CHANNEL_IDS.map(id => `<td class="c-ch">${chPill(c, id)}</td>`).join("")}
            <td>${estado(c)}</td>
            <td class="c-muted">${esc(c.comercial || "—")}</td>
            <td class="c-muted c-date">${ZharoCasos.fmtWhen(c.fecha_hora)}</td></tr>
          ${c.href ? "" : `<tr class="ops-detail hidden" data-d="${i}"><td colspan="10">${detailHtml(c)}</td></tr>`}`).join("");
        const table = `<div class="ops-tablewrap"><table class="ops-table"><thead><tr><th>Cliente</th><th>Agencia</th><th>Vehículo</th><th>Neto</th>${ZharoCasos.CHANNEL_IDS.map(id => `<th class="c-ch">${SHORT[id]}</th>`).join("")}<th>Estado</th><th>Comercial</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        const cards = `<div class="ops-cards">` + casos.map((c, i) => `<div class="ops-mcard ${c.href ? "is-link" : "is-exp"}" data-i="${i}">
            <div class="m1"><b>${esc(ZharoCasos.clientLabel(c))}</b>${estado(c)}</div>
            <div class="m2">${esc(c.agencia || "—")} · ${esc(c.vehiculo || "—")} · $ ${ZharoCasos.fmtMoney(c.neto_pedido)}</div>
            <div class="m3">${ZharoCasos.CHANNEL_IDS.map(id => `<span class="m-ch">${SHORT[id]} ${chPill(c,id)}</span>`).join("")}<span class="c-muted">${ZharoCasos.fmtWhen(c.fecha_hora)} · ${esc(c.comercial || "")}</span></div>
            ${c.href ? "" : `<div class="m-detail hidden">${detailHtml(c)}</div>`}</div>`).join("") + `</div>`;
        lista.innerHTML = table + cards;
        lista.querySelectorAll("[data-i]").forEach(el => el.addEventListener("click", () => {
          const c = casos[+el.dataset.i];
          if (c.href) { location.href = c.href; return; }
          const d = el.tagName === "TR" ? lista.querySelector(`tr[data-d="${el.dataset.i}"]`) : el.querySelector(".m-detail");
          d && d.classList.toggle("hidden"); el.classList.toggle("open");
        }));
      }
      function refresh() {
        const f = currentFilters();
        const q = $("fltQ").value.trim().toLowerCase();
        const base = ZharoCasos.applyFilters(state.all, { ...f, canal: "cualquiera", resultado: "todos" });
        let filtered = ZharoCasos.applyFilters(state.all, f);
        if (q) filtered = filtered.filter(c => [ZharoCasos.clientLabel(c), c.agencia, c.vehiculo, c.comercial].join(" ").toLowerCase().includes(q));
        renderKpis(base); renderAlerts(base); renderList(filtered);
      }
      ["fltAgencia","fltComercial","fltFecha","fltCanal","fltRes"].forEach(id => $(id).addEventListener("change", refresh));
      $("fltQ").addEventListener("input", refresh);
      $("fltSearch").addEventListener("click", refresh);
      $("fltQ").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); refresh(); } });
      $("fltClear").addEventListener("click", () => { $("fltQ").value = ""; $("fltAgencia").value = "todas"; $("fltComercial").value = "todos"; $("fltFecha").value = "todos"; $("fltCanal").value = "cualquiera"; $("fltRes").value = "todos"; refresh(); });

      lista.innerHTML = `<p class="muted ops-empty">Cargando casos…</p>`;
      const feed = await ZharoCasos.fetchFeed();
      state.all = ZharoCasos.mergeCases(ZharoCasos.mine(u.email), feed.casos || []);
      fillSelects(state.all);
      const note = $("syncNote");
      if (feed.error) note.textContent = "Datos de este dispositivo. No se pudo leer el feed del bot.";
      else if (feed.updated_at) note.textContent = `Bot + este dispositivo · feed ${ZharoCasos.fmtWhen(feed.updated_at)}`;
      refresh();
    });
  </script>
</body>
</html>
